services:
  web:
    build: .
    image: bridge-inspection:latest
    container_name: bridge-inspection
    ports:
      - "8000:8000"
    volumes:
      # 命名卷同时承载 inspection.db 及其 WAL/SHM 文件，升级后旧库自动迁移
      - inspection-data:/data
    environment:
      DB_PATH: /data/inspection.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/state', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  inspection-data:
